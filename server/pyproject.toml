[project]
name = "news-monitoring"
version = "0.1.0"
description = "Telegram news monitoring system (collector, processor, API, control bot)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChatApp Team" }]
dependencies = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "telethon>=1.36",
  "python-telegram-bot>=21.4",
  "httpx>=0.27",
  "tenacity>=8.3",
]

[project.optional-dependencies]
workers = ["redis>=5.0", "rq>=1.16"]

[project.scripts]
news-monitoring = "news_monitoring.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["news_monitoring"]
